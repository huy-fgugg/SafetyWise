name = "safetywise"
compatibility_date = "2024-11-01"
pages_build_output_dir = "public"

# KV namespace that stores all console state (users, classes, filters, activity).
# Create it once with:  npx wrangler kv namespace create SAFETYWISE_KV
# then paste the returned id below (and keep this binding name).
[[kv_namespaces]]
binding = "SAFETYWISE_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
